<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Download Link Extractor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: #111;
            color: #fff;
            text-align: center;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #0070f3;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
            transition: background 0.2s ease;
        }
        .btn:hover {
            background: #0056b3;
        }
        .btn.disabled {
            background: #444;
            pointer-events: none;
            opacity: 0.6;
        }
        #status {
            color: #aaa;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Download Delta Emulator</h1>
    
    <!-- The button that will get updated with the fresh link -->
    <a id="download-btn" href="#" class="btn disabled">Loading freshest IPA link...</a>
    <p id="status">Connecting to private Cloudflare Worker...</p>

<script>
    async function getIpaLink() {
        const downloadBtn = document.getElementById('download-btn');
        const statusText = document.getElementById('status');

        try {
            statusText.textContent = "Connecting to private Cloudflare Worker...";
            
            // 1. Fetch JSON data structure from your worker pipeline
            const response = await fetch('https://morning-term-a2ec.ts2021me.workers.dev/');
            if (!response.ok) throw new Error(`Worker connection dropped: ${response.status}`);
            
            // FIX: Parse explicitly as JSON payload instead of raw text strings
            const data = await response.json();
            console.log("Parsed Worker Payload Data:", data);

            if (data.url) {
                downloadBtn.href = data.url;
                downloadBtn.textContent = "Download Delta IPA";
                downloadBtn.classList.remove('disabled');
                
                statusText.textContent = "IPA Link updated successfully!";
                statusText.style.color = "#4caf50";
            } else {
                throw new Error("Worker connected, but failed to locate target url parameter inside the response payload.");
            }
        } catch (err) {
            console.error("Detailed Execution Error:", err);
            downloadBtn.textContent = "Download Unavailable";
            statusText.textContent = `Error: ${err.message}`;
            statusText.style.color = "#ff3333";
        }
    }

    window.addEventListener('DOMContentLoaded', getIpaLink);
</script>

</body>
</html>
