<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Download Link Extractor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: #111;
            color: #fff;
            text-align: center;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #0070f3;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
            transition: background 0.2s ease;
        }
        .btn:hover {
            background: #0056b3;
        }
        .btn.disabled {
            background: #444;
            pointer-events: none;
            opacity: 0.6;
        }
        #status {
            color: #aaa;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Download Delta Emulator</h1>
    
    <!-- The button that will get updated with the fresh link -->
    <a id="download-btn" href="#" class="btn disabled">Loading freshest IPA link...</a>
    <p id="status">Connecting to private Cloudflare Worker...</p>

    <script>
        async function getIpaLink() {
            const downloadBtn = document.getElementById('download-btn');
            const statusText = document.getElementById('status');

            try {
                // Call your private Cloudflare worker directly
                const response = await fetch('https://morning-term-a2ec.ts2021me.workers.dev/');
                
                if (!response.ok) throw new Error('Worker returned an error status.');
                
                const data = await response.json();
                
                if (data.url) {
                    // Update button destination and text
                    downloadBtn.href = data.url;
                    downloadBtn.textContent = "Download Delta IPA";
                    downloadBtn.classList.remove('disabled');
                    
                    // Update status label text
                    statusText.textContent = "IPA Link updated successfully!";
                    statusText.style.color = "#4caf50";
                    console.log("Success! Extracted IPA Link:", data.url);
                } else {
                    throw new Error("Worker connected, but no URL was found in the page text parsing.");
                }
            } catch (err) {
                console.error("Error fetching from worker:", err);
                downloadBtn.textContent = "Download Unavailable";
                statusText.textContent = "Error: Failed to dynamically grab the link.";
                statusText.style.color = "#ff3333";
            }
        }

        // CRITICAL FIX: Automatically trigger the function once the HTML DOM structure has loaded
        window.addEventListener('DOMContentLoaded', getIpaLink);
    </script>

</body>
</html>
